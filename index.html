<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarti ❤️ Prem</title>

<style>
body{
  margin:0;
  font-family:'Comic Sans MS', cursive;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
  text-align:center;
  color:white;
}

/* sections */
section{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
}
.active{display:flex;}

/* text animation */
h1{
  font-size:2.4rem;
  animation: pulse 1.5s infinite;
}
p{
  font-size:1.3rem;
}

/* buttons */
button{
  padding:14px 30px;
  margin:10px;
  font-size:1.2rem;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
.yes{background:#ff004f;color:white;}
.no{background:#555;color:white;position:relative;}

/* teddy */
.teddy{
  font-size:90px;
  animation: teddyMove 2s infinite alternate;
}

/* hearts */
.heart{
  position:absolute;
  font-size:20px;
  animation: float 6s linear infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.12);}
  100%{transform:scale(1);}
}
@keyframes teddyMove{
  from{transform:translateX(-25px);}
  to{transform:translateX(25px);}
}
@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- Screen 1 -->
<section class="active" id="s1">
  <h1>Aarti 💖</h1>
  <h1>Will you be my Valentine? 💘</h1>
  <button class="yes" onclick="go(2)">YES 💕</button>
  <button class="no" onmouseover="moveNo()">NO 🙈</button>
</section>

<!-- Screen 2 -->
<section id="s2">
  <h1>Aarti 🥰</h1>
  <div class="teddy">🧸</div>
  <p>How much do you love me? 💞</p>
  <button class="yes" onclick="go(3)">A little ❤️</button>
  <button class="yes" onclick="go(3)">A lot 💖</button>
  <button class="yes" onclick="go(3)">Infinity ♾️😍</button>
</section>

<!-- Screen 3 -->
<section id="s3">
  <h1>Aarti 💕</h1>
  <p>You are my smile 😊</p>
  <p>You are my happiness ✨</p>
  <button class="yes" onclick="go(4)">Next 💌</button>
</section>

<!-- Screen 4 -->
<section id="s4">
  <h1>Happy Valentine’s Day Aarti ❤️</h1>
  <div class="teddy">🧸💖</div>
  <p>
    You are not just my Valentine,<br>
    you are my forever 💝
  </p>
  <h2 style="margin-top:20px;">
    With all my love,<br>Prem ❤️
  </h2>
</section>

<script>
function go(n){
  document.querySelectorAll("section")
    .forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");
}

function moveNo(){
  const b=document.querySelector(".no");
  b.style.left=(Math.random()*200-100)+"px";
  b.style.top=(Math.random()*200-100)+"px";
}

function hearts(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(hearts,250);
</script>

</body>
</html>
