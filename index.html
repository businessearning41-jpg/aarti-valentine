<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine Card ❤️</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Poppins, sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fbc2eb,#a18cd1);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.card{
  width:92%;
  max-width:420px;
  background:#fff0f6;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  padding:18px;
  text-align:center;
  display:none;
  position:relative;
}
.card.active{display:block}
h1{
  font-family:'Great Vibes', cursive;
  font-size:2.2rem;
  background:linear-gradient(45deg,#ff4d6d,#9b5de5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin:10px 0;
}
.question{
  font-size:1.15rem;
  font-weight:500;
  margin:12px 0;
  background:linear-gradient(45deg,#ff4d6d,#9b5de5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.frame{
  margin:12px auto;
  padding:6px;
  border-radius:16px;
  background:linear-gradient(45deg,#ff4d6d,#9b5de5);
  width:100%;
}
.frame img{
  width:100%;
  border-radius:12px;
  display:block;
}
.buttons{
  display:flex;
  justify-content:space-around;
  margin-top:15px;
  position:relative;
}
button{
  border:none;
  border-radius:30px;
  padding:12px 22px;
  font-size:1rem;
  cursor:pointer;
  color:#fff;
  background:#ff4d6d;
  transition:.2s;
}
button:hover{transform:scale(1.05)}
.no-btn{background:#9b5de5; position:relative}
.list span{
  display:block;
  opacity:0;
  margin:8px 0;
  animation:show 1s forwards;
}
@keyframes show{to{opacity:1}}
.signature{
  margin-top:10px;
  font-size:1.2rem;
  font-family:'Great Vibes', cursive;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.start-btn{
  padding:15px 35px;
  font-size:1.3rem;
  border:none;
  border-radius:40px;
  background:#ff4d6d;
  color:#fff;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
  <div>
    <h1 style="color:#fff">Tap to Start ❤️</h1>
    <button class="start-btn" onclick="startAll()">Start</button>
  </div>
</div>

<audio id="music" loop>
  <source src="https://archive.org/download/RomanticPianoMusic/RomanticPianoMusic.mp3" type="audio/mpeg">
</audio>

<!-- OPENING -->
<div class="card active" id="card0">
  <h1>Hi Aarti ❤️</h1>
  <div class="frame"><img src="./images/boy_start.jpg"></div>
  <button onclick="next(0)">Next</button>
</div>

<script>
const questions = [
  {q:"क्या तुम्हें मेरी मुस्कान पसंद है? 😊", img:"q1.jpg"},
  {q:"क्या तुम मेरे साथ हँसना चाहोगी? 😄", img:"q2.jpg"},
  {q:"क्या हम साथ में ढेर सारी यादें बनाएँ? 📸", img:"q3.jpg"},
  {q:"क्या तुम मेरा हाथ हमेशा थामे रहोगी? 🤝", img:"q4.jpg"},
  {q:"क्या तुम मेरी हर खुशी बनोगी? 🌸", img:"q5.jpg"},
  {q:"क्या तुम मेरे हर सपने का हिस्सा बनोगी? ✨", img:"q6.jpg"},
  {q:"क्या तुम्हारी आँखों में मैं अपना घर देख सकता हूँ? 👀❤️", img:"q7_eyes.jpg"},
  {q:"क्या तुम हमेशा मेरी Valentine रहोगी? 💖", img:"q2.jpg"}
];
let noTexts=["गलत जवाब 😜","फिर सोचो… 🤔","पक्का? ❤️"];
</script>

<script>
let container=document.body;
questions.forEach((item,i)=>{
  let d=document.createElement("div");
  d.className="card";
  d.id="card"+(i+1);
  d.innerHTML=`
    <h1>Question ${i+1}</h1>
    <div class="question" id="qt${i}">${item.q}</div>
    <div class="frame"><img src="./images/${item.img}"></div>
    <div class="buttons">
      <button onclick="next(${i+1})">हाँ</button>
      <button class="no-btn" onclick="noAction(this,${i})">नहीं</button>
    </div>
  `;
  container.appendChild(d);
});
</script>

<div class="card" id="week">
  <h1>Valentine Week 💝</h1>
  <div class="list">
    <span style="animation-delay:0s">🌹 Happy Rose Day</span>
    <span style="animation-delay:1s">🧸 Happy Teddy Day</span>
    <span style="animation-delay:2s">🍫 Happy Chocolate Day</span>
    <span style="animation-delay:3s">💍 Happy Propose Day</span>
    <span style="animation-delay:4s">🤝 Happy Promise Day (in advance)</span>
    <span style="animation-delay:5s">🤗 Happy Hug Day (in advance)</span>
    <span style="animation-delay:6s">💋 Happy Kiss Day (in advance)</span>
    <span style="animation-delay:7s">❤️ Happy Valentine’s Day (in advance)</span>
  </div>
  <button onclick="showFinal()">Next</button>
</div>

<div class="card" id="final">
  <h1>Happy Valentine’s Day Aarti ❤️</h1>
  <div class="frame"><img src="./images/couple.jpg"></div>
  <div class="signature">— Prem 💕</div>
</div>

<script>
function startAll(){
  document.getElementById("overlay").style.display="none";
  document.getElementById("music").play();
}
function next(i){
  document.getElementById("card"+i).classList.remove("active");
  if(i+1<=questions.length)
    document.getElementById("card"+(i+1)).classList.add("active");
  else
    document.getElementById("week").classList.add("active");
}
function noAction(btn,i){
  let t=document.getElementById("qt"+i);
  let idx=btn.dataset.i||0;
  t.textContent=noTexts[idx%3];
  btn.dataset.i=++idx;
  btn.style.left=Math.random()*120-60+"px";
}
function showFinal(){
  document.getElementById("week").classList.remove("active");
  document.getElementById("final").classList.add("active");
}
</script>

</body>
</html>
